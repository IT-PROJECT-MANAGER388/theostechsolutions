<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" type="text/css" href="contact.css">
</head>
<body>
    
    <section>

        <h1>Connect With Us</h1>

        <p>
            We would love to respond to your queries and help you succeed.<br> Feel 
            free to get in touch with us.
        </p>

        <div class="contact-box"> <!-- CONTACT SECTION -->

            <div class="contact-left"> <!-- CONTACT-LEFT -->

                <h3>Send request</h3>

                <form>

                    <div class="input-row"> <!-- data (row1)-->

                        <div class="input-group"> <!-- NAME -->

                            <label for="name">Name</label>
                            <input type="text" placeholder="Theo Jalieel" id="name">

                        </div>

                        <div class="input-group"> <!-- PHONE -->

                            <label for="phone">Phone</label>
                            <input type="text" placeholder="078 693 7926" id="phone">

                        </div>

                    </div>

                    <div class="input-row"> <!-- data (row2)-->

                        <div class="input-group"> <!-- EMAIL -->

                            <label for="email">Email</label> 
                            <input type="email" placeholder="jalieel@gmail.com" id="email">

                        </div>

                        <div class="input-group"> <!-- SUBJECT -->

                            <label for="subject">Subject</label>
                            <input type="text" id="subject" placeholder="Subject">

                        </div>

                    </div>

                    <label>Message</label>
                    <textarea rows="5"></textarea>

                    <button type="submit">SEND</button>

                </form>


            </div>

            <div class="contact-right"> <!-- CONTACT-RIGHT -->

                <h3>Reach Us</h3>

                <table>

                    <tr scope="email_row">

                        <td>Email</td>
                        <td>info@theostech.co.za</td>

                    </tr>

                    <tr scope="phone_row">

                        <td>Phone</td>
                        <td>078-693-7926</td>
                        
                    </tr>

                    <tr scope="address_row">

                        <td>Address</td>
                        <td>Johannesburg, Gauteng, SA</td>

                    </tr>

                </table>


            </div>

        </div>

    </section>

</body>
</html>
